<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elotemanía POS</title>

<style>
*{
 box-sizing:border-box;
}

body{
 margin:0;
 font-family:Arial,Helvetica,sans-serif;
 background:#111;
 color:white;
}

header{
 background:#000;
 padding:18px;
 text-align:center;
 border-bottom:2px solid #d4af37;
}

header h1{
 margin:0;
 color:#d4af37;
 font-size:28px;
}

header p{
 margin:5px 0 0;
 color:#ddd;
}

.container{
 max-width:1100px;
 margin:auto;
 padding:15px;
}

.stats{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:10px;
 margin-bottom:15px;
}

.stat{
 background:#1d1d1d;
 border:1px solid #333;
 border-radius:12px;
 padding:15px;
 text-align:center;
}

.stat b{
 display:block;
 font-size:24px;
 color:#d4af37;
}

.tabs{
 display:flex;
 gap:8px;
 margin-bottom:15px;
}

.tabs button{
 flex:1;
}

button{
 border:0;
 border-radius:10px;
 padding:13px;
 font-weight:bold;
 cursor:pointer;
}

.btn-gold{
 background:#d4af37;
 color:#000;
}

.btn-dark{
 background:#292929;
 color:white;
}

.btn-green{
 background:#25D366;
 color:white;
}

.btn-red{
 background:#c62828;
 color:white;
}

.btn-blue{
 background:#1976d2;
 color:white;
}

.card{
 background:#1b1b1b;
 border:1px solid #333;
 border-radius:14px;
 padding:15px;
 margin-bottom:15px;
}

h2{
 color:#d4af37;
 margin-top:0;
}

input,select{
 width:100%;
 padding:13px;
 border-radius:9px;
 border:1px solid #444;
 background:#101010;
 color:white;
 margin:6px 0 10px;
 font-size:16px;
}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
 gap:10px;
}

.producto{
 background:#242424;
 border:1px solid #444;
 border-radius:12px;
 padding:12px;
}

.producto strong{
 display:block;
 margin-bottom:6px;
}

.producto button{
 width:100%;
 margin-top:8px;
}

.item{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 border-bottom:1px solid #333;
 padding:10px 0;
}

.total{
 font-size:24px;
 color:#d4af37;
 text-align:right;
 margin-top:15px;
}

.hidden{
 display:none;
}

.alerta{
 padding:12px;
 border-radius:10px;
 background:#332b00;
 border:1px solid #d4af37;
 margin-top:10px;
}

.premio{
 padding:14px;
 border-radius:10px;
 background:#153d1d;
 border:1px solid #25D366;
 margin-top:10px;
}

.resultado{
 padding:15px;
 background:#202020;
 border-radius:12px;
 margin-top:12px;
}

@media(max-width:600px){
 .stats{
  grid-template-columns:1fr;
 }
}
</style>
</head>

<body>

<header>
 <h1>🌽 ELOTEMANÍA</h1>
 <p>Entre compas sabe mejor</p>
</header>

<div class="container">

 <div class="stats">
  <div class="stat">
   <span>Ventas</span>
   <b id="ventasHoy">0</b>
  </div>

  <div class="stat">
   <span>Clientes</span>
   <b id="clientesHoy">0</b>
  </div>

  <div class="stat">
   <span>Turno</span>
   <b>1</b>
  </div>
 </div>

 <div class="tabs">
  <button class="btn-gold" onclick="mostrarVenta()">Venta</button>
  <button class="btn-dark" onclick="mostrarAcceso()">Acceso</button>
 </div>

 <section id="ventaSection">

  <div class="card">
   <h2>🛒 Productos</h2>
   <div id="productos" class="grid">
    Cargando productos...
   </div>
  </div>

  <div class="card">
   <h2>🧾 Venta</h2>

   <div id="carrito">
    No hay productos.
   </div>

   <div class="total">
    Total: $<span id="total">0.00</span>
   </div>
  </div>

  <div class="card">

   <h2>👤 Cliente</h2>

   <label>Nombre</label>
   <input
    id="nombreCliente"
    type="text"
    placeholder="Nombre del cliente"
   >

   <label>WhatsApp</label>
   <input
    id="whatsappCliente"
    type="tel"
    placeholder="10 dígitos"
   >

   <button
    class="btn-blue"
    onclick="buscarCliente()"
   >
    🔎 Buscar cliente
   </button>

   <div id="clienteResultado"></div>

   <button
    class="btn-gold"
    style="width:100%;margin-top:10px"
    onclick="registrarVenta()"
   >
    💰 Registrar venta
   </button>

  </div>

 </section>


 <section id="accesoSection" class="hidden">

  <div class="card">
   <h2>🔐 Acceso</h2>

   <input
    id="usuario"
    placeholder="Usuario"
   >

   <input
    id="pin"
    type="password"
    placeholder="PIN"
   >

   <button
    class="btn-gold"
    onclick="login()"
   >
    Entrar
   </button>

   <div id="accesoResultado"></div>
  </div>

  <div id="adminSection" class="hidden">

   <div class="card">
    <h2>🎁 Cliente / Premio</h2>

    <input
     id="buscarAdmin"
     placeholder="WhatsApp del cliente"
    >

    <button
     class="btn-blue"
     onclick="buscarClienteAdmin()"
    >
     🔎 Buscar cliente
    </button>

    <div id="adminClienteResultado"></div>
   </div>

   <div class="card">
    <h2>⚙️ Turno</h2>

    <button
     class="btn-gold"
     onclick="hacerCorte()"
    >
     Cerrar turno
    </button>

    <button
     class="btn-red"
     style="margin-top:10px"
     onclick="borrarUltimoCorte()"
    >
     Borrar último corte
    </button>

    <button
     class="btn-red"
     style="margin-top:10px"
     onclick="borrarHistorial()"
    >
     Borrar todo el historial
    </button>
   </div>

  </div>

 </section>

</div>


<script>

const API="/api/supabase";

let productos=[];
let carrito=[];
let clientes=[];
let configuracion={
 puntos_para_premio:10,
 premio:"Premio"
};

let currentUser=null;
let clienteSeleccionado=null;


/* =========================
   API
========================= */

async function api(
 tabla,
 metodo="GET",
 cuerpo=null,
 params={}
){

 let url=new URL(API,window.location.origin);

 url.searchParams.set("table",tabla);

 Object.keys(params).forEach(k=>{
  if(params[k]!==undefined && params[k]!==null){
   url.searchParams.set(k,params[k]);
  }
 });

 let opciones={
  method:metodo,
  headers:{
   "Content-Type":"application/json"
  }
 };

 if(cuerpo!==null){
  opciones.body=JSON.stringify(cuerpo);
 }

 const respuesta=await fetch(
  url.toString(),
  opciones
 );

 const texto=await respuesta.text();

 let datos;

 try{
  datos=texto ? JSON.parse(texto):null;
 }catch{
  throw new Error(texto||"Respuesta inválida");
 }

 if(!respuesta.ok){

  let mensaje=
   datos?.message||
   datos?.error||
   datos?.details||
   datos?.hint||
   "Error en Supabase";

  throw new Error(mensaje);
 }

 return datos;
}


/* =========================
   INICIO
========================= */

async function iniciar(){

 try{

  await cargarConfiguracion();
  await cargarProductos();
  await cargarClientes();
  await actualizarEstadisticas();

 }catch(error){

  alert(
   "Error al iniciar:\n"+
   error.message
  );

 }

}

iniciar();


/* =========================
   NAVEGACIÓN
========================= */

function mostrarVenta(){

 document
  .getElementById("ventaSection")
  .classList.remove("hidden");

 document
  .getElementById("accesoSection")
  .classList.add("hidden");

}


function mostrarAcceso(){

 document
  .getElementById("ventaSection")
  .classList.add("hidden");

 document
  .getElementById("accesoSection")
  .classList.remove("hidden");

}


/* =========================
   CONFIGURACIÓN
========================= */

async function cargarConfiguracion(){

 try{

  const datos=
   await api(
    "configuracion",
    "GET",
    null,
    {
     select:"*",
     limit:1
    }
   );

  if(datos && datos.length){

   configuracion.puntos_para_premio=
    Number(datos[0].puntos_para_premio)||10;

   configuracion.premio="Premio";

  }

 }catch(error){

  console.log(error);

 }

}


/* =========================
   PRODUCTOS
========================= */

async function cargarProductos(){

 productos=
  await api(
   "productos",
   "GET",
   null,
   {
    select:"*",
    activo:"eq.true",
    order:"nombre.asc"
   }
  );

 renderProductos();
}


function renderProductos(){

 const contenedor=
  document.getElementById("productos");

 if(!productos.length){

  contenedor.innerHTML=
   "No hay productos activos.";

  return;

 }

 contenedor.innerHTML="";

 productos.forEach(producto=>{

  const div=
   document.createElement("div");

  div.className="producto";

  div.innerHTML=`
   <strong>${escapeHtml(producto.nombre)}</strong>
   <div>$${dinero(producto.precio)}</div>
   <button
    class="btn-gold"
    onclick="agregarProducto(${producto.id})"
   >
    Agregar
   </button>
  `;

  contenedor.appendChild(div);

 });

}


/* =========================
   CARRITO
========================= */

function agregarProducto(id){

 const producto=
  productos.find(
   p=>Number(p.id)===Number(id)
  );

 if(!producto)return;

 const existente=
  carrito.find(
   p=>Number(p.id)===Number(id)
  );

 if(existente){

  existente.cantidad++;

 }else{

  carrito.push({
   id:producto.id,
   nombre:producto.nombre,
   precio:Number(producto.precio),
   cantidad:1
  });

 }

 renderCarrito();

}


function quitarProducto(id){

 const index=
  carrito.findIndex(
   p=>Number(p.id)===Number(id)
  );

 if(index===-1)return;

 if(carrito[index].cantidad>1){

  carrito[index].cantidad--;

 }else{

  carrito.splice(index,1);

 }

 renderCarrito();

}


function renderCarrito(){

 const contenedor=
  document.getElementById("carrito");

 if(!carrito.length){

  contenedor.innerHTML=
   "No hay productos.";

  document.getElementById("total")
   .textContent="0.00";

  return;

 }

 contenedor.innerHTML="";

 let total=0;

 carrito.forEach(item=>{

  const subtotal=
   item.precio*item.cantidad;

  total+=subtotal;

  const div=
   document.createElement("div");

  div.className="item";

  div.innerHTML=`
   <div>
    <strong>${escapeHtml(item.nombre)}</strong>
    <br>
    ${item.cantidad} × $${dinero(item.precio)}
   </div>

   <button
    class="btn-red"
    onclick="quitarProducto(${item.id})"
   >
    −
   </button>
  `;

  contenedor.appendChild(div);

 });

 document.getElementById("total")
  .textContent=dinero(total);

}


function obtenerTotal(){

 return carrito.reduce(
  (total,item)=>
   total+(item.precio*item.cantidad),
  0
 );

}


/* =========================
   CLIENTES
========================= */

async function cargarClientes(){

 clientes=
  await api(
   "clientes",
   "GET",
   null,
   {
    select:"*",
    order:"nombre.asc"
   }
  );

}


function normalizarWhatsapp(numero){

 return String(numero||"")
  .replace(/\D/g,"");

}


function numeroWhatsapp(numero){

 let n=
  normalizarWhatsapp(numero);

 if(n.length===10){

  n="52"+n;

 }

 return n;

}


async function buscarCliente(){

 const whatsapp=
  normalizarWhatsapp(
   document.getElementById(
    "whatsappCliente"
   ).value
  );

 if(!whatsapp){

  alert(
   "Escribe el número de WhatsApp."
  );

  return;

 }

 try{

  const encontrados=
   await api(
    "clientes",
    "GET",
    null,
    {
     select:"*",
     whatsapp:"eq."+whatsapp,
     limit:1
    }
   );

  if(encontrados.length){

   clienteSeleccionado=
    encontrados[0];

   document.getElementById(
    "nombreCliente"
   ).value=
    clienteSeleccionado.nombre||"";

   mostrarClienteResultado(
    clienteSeleccionado
   );

  }else{

   clienteSeleccionado=null;

   document.getElementById(
    "clienteResultado"
   ).innerHTML=`
    <div class="alerta">
     👤 Cliente nuevo.<br>
     Al registrarse tendrá
     <strong>${configuracion.puntos_para_premio}</strong>
     compras restantes para su Premio.
    </div>
   `;

  }

 }catch(error){

  alert(
   "No se pudo buscar el cliente:\n"+
   error.message
  );

 }

}


function mostrarClienteResultado(cliente){

 const puntos=
  Number(cliente.puntos);

 let html=`
  <div class="resultado">

   <strong>
    👤 ${escapeHtml(cliente.nombre)}
   </strong>

   <br><br>

   📱 ${escapeHtml(cliente.whatsapp)}

   <br><br>

   ⭐ Compras restantes:
   <strong>${puntos}</strong>
 `;

 if(puntos<=0){

  html+=`
   <div class="premio">
    🎉 ¡Ya puede solicitar su Premio!
   </div>
  `;

 }else{

  html+=`
   <div class="alerta">
    ⭐ Le faltan
    <strong>${puntos}</strong>
    compras para su Premio.
   </div>
  `;

 }

 html+=`
  </div>
 `;

 document.getElementById(
  "clienteResultado"
 ).innerHTML=html;

}


/* =========================
   REGISTRAR VENTA
========================= */

async function registrarVenta(){

 if(!carrito.length){

  alert(
   "Agrega al menos un producto."
  );

  return;

 }

 const nombre=
  document.getElementById(
   "nombreCliente"
  ).value.trim();

 const whatsapp=
  normalizarWhatsapp(
   document.getElementById(
    "whatsappCliente"
   ).value
  );

 if(!nombre){

  alert(
   "Escribe el nombre del cliente."
  );

  return;

 }

 if(!whatsapp){

  alert(
   "Escribe el WhatsApp del cliente."
  );

  return;

 }

 try{

  /* =====================
     BUSCAR CLIENTE POR
     WHATSAPP EXACTO
  ===================== */

  let clienteActual=null;

  const encontrados=
   await api(
    "clientes",
    "GET",
    null,
    {
     select:"*",
     whatsapp:"eq."+whatsapp,
     limit:1
    }
   );

  if(encontrados.length){

   clienteActual=
    encontrados[0];

  }


  /* =====================
     CONTADOR INDIVIDUAL
  ===================== */

  let puntosAntes;
  let puntosDespues;

  if(clienteActual){

   puntosAntes=
    Number(clienteActual.puntos);

   /*
    Si el cliente ya existe,
    SOLO se modifica ese cliente.
   */

   if(
    !Number.isFinite(puntosAntes) ||
    puntosAntes<0
   ){

    puntosAntes=
     configuracion.puntos_para_premio;

   }

   puntosDespues=
    Math.max(
     0,
     puntosAntes-1
    );

  }else{

   /*
    Cliente nuevo:
    empieza en 10 y esta compra
    cuenta como la primera.
   */

   puntosAntes=
    configuracion.puntos_para_premio;

   puntosDespues=
    Math.max(
     0,
     puntosAntes-1
    );

  }


  /* =====================
     CREAR / ACTUALIZAR
     CLIENTE
  ===================== */

  if(clienteActual){

   const actualizado=
    await api(
     "clientes",
     "PATCH",
     {
      nombre:nombre,
      whatsapp:whatsapp,
      puntos:puntosDespues
     },
     {
      id:"eq."+clienteActual.id
     }
    );

   if(
    !actualizado ||
    !actualizado.length
   ){

    throw new Error(
     "No se pudo actualizar el contador del cliente."
    );

   }

   clienteActual=
    actualizado[0];

  }else{

   const nuevo=
    await api(
     "clientes",
     "POST",
     {
      nombre:nombre,
      whatsapp:whatsapp,
      puntos:puntosDespues,
      premios_obtenidos:0
     }
    );

   if(
    !nuevo ||
    !nuevo.length
   ){

    throw new Error(
     "No se pudo crear el cliente."
    );

   }

   clienteActual=
    nuevo[0];

  }


  /* =====================
     VENTA
  ===================== */

  const total=
   obtenerTotal();

  const venta=
   await api(
    "ventas",
    "POST",
    {
     cliente_id:clienteActual.id,
     total:total,
     puntos_ganados:1
    }
   );

  if(
   !venta ||
   !venta.length
  ){

   throw new Error(
    "No se pudo registrar la venta."
   );

  }

  const ventaId=
   venta[0].id;


  /* =====================
     DETALLE
  ===================== */

  for(const item of carrito){

   await api(
    "detalle_ventas",
    "POST",
    {
     venta_id:ventaId,
     producto_id:item.id,
     nombre_producto:item.nombre,
     cantidad:item.cantidad,
     precio:item.precio
    }
   );

  }


  /* =====================
     WHATSAPP
  ===================== */

  let mensaje=
`🌽 *ELOTEMANÍA* 🌽

Hola ${nombre}!
Gracias por tu compra.

💰 Total: $${dinero(total)}

⭐ Compras restantes para tu Premio: ${puntosDespues}

🎁 Premio`;

  if(puntosDespues===0){

   mensaje+=
`\n🎉 ¡Ya puedes solicitar tu Premio!`;

  }


  let botonWhatsApp="";

  if(whatsapp){

   const numero=
    numeroWhatsapp(whatsapp);

   const url=
    "https://wa.me/"+
    numero+
    "?text="+
    encodeURIComponent(mensaje);

   botonWhatsApp=`
    <br>

    <a
     href="${url}"
     target="_blank"
     style="
      display:block;
      text-align:center;
      background:#25D366;
      color:white;
      padding:14px;
      border-radius:10px;
      text-decoration:none;
      font-weight:bold;
     "
    >
     📲 Abrir WhatsApp y enviar mensaje
    </a>
   `;

  }


  /* =====================
     RESULTADO
  ===================== */

  document.getElementById(
   "clienteResultado"
  ).innerHTML=`
   <div class="resultado">

    <h3>✅ Venta registrada</h3>

    👤 ${escapeHtml(nombre)}

    <br><br>

    💰 Total:
    <strong>$${dinero(total)}</strong>

    <br><br>

    ⭐ Compras restantes:
    <strong>${puntosDespues}</strong>

    ${
     puntosDespues===0
      ? `
       <div class="premio">
        🎉 ¡Ya puede solicitar su Premio!
       </div>
      `
      : ""
    }

    ${botonWhatsApp}

   </div>
  `;


  carrito=[];

  renderCarrito();

  await cargarClientes();

  await actualizarEstadisticas();


 }catch(error){

  console.error(error);

  alert(
   "No se pudo registrar la venta:\n"+
   error.message
  );

 }

}


/* =========================
   LOGIN
========================= */

function login(){

 const usuario=
  document.getElementById(
   "usuario"
  ).value.trim().toLowerCase();

 const pin=
  document.getElementById(
   "pin"
  ).value.trim();

 if(
  usuario==="christian" &&
  pin==="0204"
 ){

  currentUser="christian";

  document.getElementById(
   "adminSection"
  ).classList.remove("hidden");

  document.getElementById(
   "accesoResultado"
  ).innerHTML=
   `<div class="premio">
    👑 Bienvenido Christian
   </div>`;

  return;

 }

 if(
  usuario==="andrid" &&
  pin==="1234"
 ){

  currentUser="andrid";

  document.getElementById(
   "adminSection"
  ).classList.remove("hidden");

  document.getElementById(
   "accesoResultado"
  ).innerHTML=
   `<div class="premio">
    👤 Bienvenido Andrid
   </div>`;

  return;

 }

 document.getElementById(
  "accesoResultado"
 ).innerHTML=
  `<div class="alerta">
   ❌ Usuario o PIN incorrecto.
  </div>`;

}


/* =========================
   BUSCAR CLIENTE ADMIN
========================= */

async function buscarClienteAdmin(){

 if(
  currentUser!=="christian" &&
  currentUser!=="andrid"
 ){

  alert(
   "Debes iniciar sesión."
  );

  return;

 }

 const whatsapp=
  normalizarWhatsapp(
   document.getElementById(
    "buscarAdmin"
   ).value
  );

 if(!whatsapp){

  alert(
   "Escribe el WhatsApp del cliente."
  );

  return;

 }

 try{

  const encontrados=
   await api(
    "clientes",
    "GET",
    null,
    {
     select:"*",
     whatsapp:"eq."+whatsapp,
     limit:1
    }
   );

  if(!encontrados.length){

   document.getElementById(
    "adminClienteResultado"
   ).innerHTML=
    `<div class="alerta">
     ❌ Cliente no encontrado.
    </div>`;

   return;

  }

  const cliente=
   encontrados[0];

  renderAdminCliente(cliente);

 }catch(error){

  alert(
   "Error:\n"+
   error.message
  );

 }

}


function renderAdminCliente(cliente){

 const puntos=
  Number(cliente.puntos);

 let html=`
  <div class="resultado">

   <h3>
    👤 ${escapeHtml(cliente.nombre)}
   </h3>

   📱 ${escapeHtml(cliente.whatsapp)}

   <br><br>

   ⭐ Compras restantes:
   <strong>${puntos}</strong>

   <br><br>

   🎁 Premio obtenidos:
   <strong>
    ${Number(cliente.premios_obtenidos)||0}
   </strong>

 `;


 /* =====================
    RESTAURAR A 10
 ===================== */

 html+=`
  <br><br>

/* =========================
   RESTAURAR CLIENTE
========================= */

async function restaurarCliente(id){

 if(
  currentUser!=="christian" &&
  currentUser!=="andrid"
 ){

  alert(
   "No tienes permiso."
  );

  return;

 }

 const confirmar=
  confirm(
   "¿Restaurar este cliente a "+
   configuracion.puntos_para_premio+
   " compras restantes?"
  );

 if(!confirmar)return;

 try{

  const actualizado=
   await api(
    "clientes",
    "PATCH",
    {
     puntos:
      configuracion.puntos_para_premio
    },
    {
     id:"eq."+id
    }
   );

  if(
   !actualizado ||
   !actualizado.length
  ){

   throw new Error(
    "No se pudo restaurar el cliente."
   );

  }

  renderAdminCliente(
   actualizado[0]
  );

  await cargarClientes();

  alert(
   "✅ Cliente restaurado a "+
   configuracion.puntos_para_premio+
   " compras."
  );

 }catch(error){

  alert(
   "No se pudo restaurar:\n"+
   error.message
  );

 }

}


/* =========================
   CANJEAR PREMIO
========================= */

async function canjearPremio(id){

 if(
  currentUser!=="christian" &&
  currentUser!=="andrid"
 ){

  alert(
   "No tienes permiso."
  );

  return;

 }

 try{

  const encontrados=
   await api(
    "clientes",
    "GET",
    null,
    {
     select:"*",
     id:"eq."+id,
     limit:1
    }
   );

  if(!encontrados.length){

   alert(
    "Cliente no encontrado."
   );

   return;

  }

  const cliente=
   encontrados[0];

  if(Number(cliente.puntos)>0){

   alert(
    "Este cliente todavía no puede canjear el Premio."
   );

   return;

  }

  const confirmar=
   confirm(
    "¿Confirmar canje del Premio?"
   );

  if(!confirmar)return;

  const premios=
   (Number(cliente.premios_obtenidos)||0)+1;

  const actualizado=
   await api(
    "clientes",
    "PATCH",
    {
     puntos:
      configuracion.puntos_para_premio,

     premios_obtenidos:
      premios
    },
    {
     id:"eq."+id
    }
   );

  if(
   !actualizado ||
   !actualizado.length
  ){

   throw new Error(
    "No se pudo registrar el canje."
   );

  }

  renderAdminCliente(
   actualizado[0]
  );

  await cargarClientes();

  alert(
   "🎉 Premio canjeado.\n\n"+
   "El contador volvió a "+
   configuracion.puntos_para_premio+"."
  );

 }catch(error){

  alert(
   "Error al canjear:\n"+
   error.message
  );

 }

}

/* =========================
   CORTE
========================= */

async function hacerCorte(){

 if(
  currentUser!=="christian" &&
  currentUser!=="andrid"
 ){

  alert(
   "Debes iniciar sesión."
  );

  return;

 }

 try{

  const ventas=
   await api(
    "ventas",
    "GET",
    null,
    {
     select:"*"
    }
   );

  const pendientes=
   ventas.filter(
    v=>
     v.corte_id===null ||
     v.corte_id===undefined
   );

  const total=
   pendientes.reduce(
    (s,v)=>
     s+Number(v.total||0),
    0
   );

  const clientesCorte=
   new Set(
    pendientes
     .map(v=>v.cliente_id)
     .filter(Boolean)
   );

  const corte=
   await api(
    "cierres_turno",
    "POST",
    {
     ventas:pendientes.length,
     clientes:clientesCorte.size,
     efectivo_esperado:total,
     efectivo_contado:total,
     diferencia:0
    }
   );

  if(!corte.length){

   throw new Error(
    "No se pudo crear el corte."
   );

  }

  const corteId=
   corte[0].id;

  for(const venta of pendientes){

   await api(
    "ventas",
    "PATCH",
    {
     corte_id:corteId
    },
    {
     id:"eq."+venta.id
    }
   );

  }

  alert(
   "✅ Turno cerrado.\n\n"+
   "Ventas: "+pendientes.length+
   "\nTotal: $"+dinero(total)
  );

  await actualizarEstadisticas();

 }catch(error){

  alert(
   "No se pudo cerrar el turno:\n"+
   error.message
  );

 }

}


/* =========================
   BORRAR ÚLTIMO CORTE
========================= */

async function borrarUltimoCorte(){

 if(currentUser!=="christian"){

  alert(
   "Solo Christian puede borrar cortes."
  );

  return;

 }

 if(
  !confirm(
   "¿Borrar el último corte?"
  )
 )return;

 try{

  const cortes=
   await api(
    "cierres_turno",
    "GET",
    null,
    {
     select:"*",
     order:"id.desc",
     limit:1
    }
   );

  if(!cortes.length){

   alert(
    "No hay cortes."
   );

   return;

  }

  const corte=
   cortes[0];

  await api(
   "ventas",
   "PATCH",
   {
    corte_id:null
   },
   {
    corte_id:"eq."+corte.id
   }
  );

  await api(
   "cierres_turno",
   "DELETE",
   null,
   {
    id:"eq."+corte.id
   }
  );

  alert(
   "✅ Último corte eliminado."
  );

  await actualizarEstadisticas();

 }catch(error){

  alert(
   "Error:\n"+
   error.message
  );

 }

}


/* =========================

========================= */

async function borrarHistorial(){

 if(currentUser!=="christian"){

  alert(
   "Solo Christian puede borrar el historial."
  );

  return;

 }

 const confirmar=
  confirm(
   "⚠️ Esto eliminará todas las ventas y detalles.\n\n¿Continuar?"
  );

 try{

  const ventas=
   await api(
    "ventas",
    "GET",
    null,
    {
     select:"id"
    }
   );

  for(const venta of ventas){

   await api(
    "detalle_ventas",
    "DELETE",
    null,
    {
     venta_id:"eq."+venta.id
    }
   );

  }

  await api(
   "ventas",
   "DELETE"
  );

  await api(
   "cierres_turno",
   "DELETE"
  );

  alert(
   "✅ Historial eliminado."
  );

  await actualizarEstadisticas();

 }catch(error){

  alert(
   "No se pudo borrar el historial:\n"+
   error.message
  );

 }

}


/* =========================
   UTILIDADES
========================= */

function dinero(valor){

 return Number(valor||0)
  .toFixed(2);

}


function escapeHtml(text){

 return String(text||"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");

}
