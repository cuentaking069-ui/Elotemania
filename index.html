<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Elotemanía</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#fff8df;color:#222}
main{max-width:1100px;margin:auto;padding:14px}
.top,.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-size:30px;font-weight:900}
.sub,.muted{color:#666;font-size:13px}
.stats{display:flex;gap:7px}
.stat{background:#fff;border:1px solid #ddd;border-radius:12px;padding:8px;text-align:center}
.nav{display:flex;gap:8px;margin:14px 0}
.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:15px}
.card{background:#fff;border:1px solid #ddd;border-radius:17px;padding:15px;margin-bottom:15px}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.product,button,input{font:inherit}
.product,button{border:1px solid #ddd;border-radius:11px;padding:11px;background:#fff;cursor:pointer}
.primary,.active{background:#111!important;color:#fff!important}
input{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;margin-top:5px}
label{display:block;margin-top:9px}
.cartrow{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid #eee}
.grow{flex:1}
.customer,.success{padding:10px;border:1px solid #ddd;border-radius:12px;margin-top:10px}
.success{background:#effff4}
.hidden{display:none}
.adminrow{display:grid;grid-template-columns:1fr 100px 85px;gap:7px;margin:7px 0}
@media(max-width:800px){
.layout{grid-template-columns:1fr}
}
</style>
</head>

<body>
<main>

<div class="top">
<div>
<div class="brand">🌽 ELOTEMANÍA</div>
<div class="sub">Entre compas sabe mejor · Punto de venta</div>
</div>

<div class="stats">
<div class="stat">Ventas<br><b id="sales">$0</b></div>
<div class="stat">Pedidos<br><b id="orders">0</b></div>
<div class="stat">Clientes<br><b id="clients">0</b></div>
</div>
</div>

<div class="nav">
<button id="posTab" class="active">🛒 Venta</button>
<button id="adminTab">⚙️ Administrador</button>
</div>

<section id="pos">

<div class="layout">

<section class="card">
<div class="row">
<h2>📋 Menú</h2>
<button id="refresh">↻</button>
</div>

<div id="menu">Cargando...</div>
</section>

<section>

<div class="card">
<h2>🛒 Pedido</h2>
<div id="cart"></div>

<div class="row">
<b>Total</b>
<b id="total">$0</b>
</div>
</div>

<div class="card">
<h2>👤 Cliente</h2>

<label>
WhatsApp
<input id="phone" inputmode="tel" placeholder="6141234567">
</label>

<div id="customer"></div>

<label>
Nombre
<input id="name" placeholder="Nombre">
</label>

<button id="sell" class="primary" style="width:100%;margin-top:12px">
✅ Cobrar + sumar 1 punto
</button>

<div id="result"></div>
</div>

</section>
</div>
</section>

<section id="admin" class="hidden">

<div class="card" id="loginBox">
<h2>🔐 Administrador</h2>

<input id="pin" type="password" placeholder="PIN">

<button id="login" class="primary" style="margin-top:8px">
Entrar
</button>
</div>

<div class="card hidden" id="adminBox">

<div class="row">
<h2>⚙️ Administración</h2>
<button id="logout">Salir</button>
</div>

<h3>🎁 Premio</h3>

<input id="rewardPoints" type="number">
<input id="rewardName" placeholder="Premio">

<button id="saveConfig" style="margin-top:8px">
Guardar configuración
</button>

<h3>🌽 Productos</h3>

<div id="productsAdmin"></div>

<h4>Agregar producto</h4>

<input id="newName" placeholder="Nombre">
<input id="newCat" placeholder="Categoría">
<input id="newPrice" type="number" placeholder="Precio">

<button id="addProduct" class="primary" style="margin-top:8px">
Agregar
</button>

</div>
</section>

</main>

<script>

let products=[];
let cart=[];
let config={
points:10,
prize:'Premio de Elotemanía'
};

const $=x=>document.getElementById(x);

const money=n=>'$'+Number(n||0).toLocaleString('es-MX');


async function api(t,m='GET',b=null,q=''){

let r=await fetch(
'/api/supabase?table='+t+q,
{
method:m,
headers:{
'Content-Type':'application/json'
},
body:b?JSON.stringify(b):undefined
}
);

let j=await r.json();

if(!r.ok){
throw Error(j.error||'Error');
}

return j;
}


async function load(){

try{

products=await api(
'productos',
'GET',
null,
'&activo=eq.true&order=id.asc'
);

let c=await api(
'configuracion',
'GET',
null,
'&order=id.asc&limit=1'
);

if(c[0]){
config.points=c[0].puntos_para_premio;
config.prize=c[0].premio;
}

let cs=await api(
'clientes',
'GET',
null,
'&select=id'
);

$('clients').textContent=cs.length;

let vs=await api(
'ventas',
'GET',
null,
'&select=id,total'
);

$('orders').textContent=vs.length;

$('sales').textContent=money(
vs.reduce((s,v)=>s+Number(v.total),0)
);

renderMenu();
renderCart();

}catch(e){

$('menu').innerHTML='⚠️ '+e.message;

}

}


function renderMenu(){

let cats=[
...new Set(products.map(p=>p.categoria))
];

$('menu').innerHTML=cats.map(c=>

'<h3>🌽 '+c+'</h3>'+
'<div class="products">'+

products
.filter(p=>p.categoria===c)
.map(p=>

'<button class="product" data-add="'+p.id+'">'+
'<b>'+p.nombre+'</b><br>'+
'<span class="muted">'+money(p.precio)+'</span>'+
'</button>'

).join('')+

'</div>'

).join('');

}


function renderCart(){

$('cart').innerHTML=cart.length?

cart.map((x,i)=>

'<div class="cartrow">'+
'<span class="grow">'+x.nombre+' × '+x.cantidad+'</span>'+
'<b>'+money(x.precio*x.cantidad)+'</b>'+
'<button data-minus="'+i+'">−</button>'+
'</div>'

).join('')

:

'<span class="muted">Pedido vacío.</span>';

$('total').textContent=money(
cart.reduce((s,x)=>s+x.precio*x.cantidad,0)
);

}


$('menu').onclick=e=>{

let b=e.target.closest('[data-add]');

if(!b)return;

let p=products.find(x=>x.id==b.dataset.add);

let x=cart.find(x=>x.producto_id===p.id);

if(x){
x.cantidad++;
}else{

cart.push({
producto_id:p.id,
nombre:p.nombre,
precio:Number(p.precio),
cantidad:1
});

}

renderCart();

};


$('cart').onclick=e=>{

let b=e.target.closest('[data-minus]');

if(!b)return;

let i=+b.dataset.minus;

if(cart[i].cantidad>1){

cart[i].cantidad--;

}else{

cart.splice(i,1);

}

renderCart();

};


$('refresh').onclick=load;


$('phone').oninput=async()=>{

let w=$('phone').value.replace(/\D/g,'');

if(w.length<10){

$('customer').innerHTML='';

return;

}

try{

let a=await api(
'clientes',
'GET',
null,
'&whatsapp=eq.'+encodeURIComponent(w)+'&limit=1'
);

if(a[0]){

$('name').value=a[0].nombre;

$('customer').innerHTML=
'<div class="customer">'+
'⭐ '+a[0].puntos+'/'+config.points+
' puntos · 🎁 '+
a[0].premios_obtenidos+
' premios</div>';

}else{

$('customer').innerHTML=
'<div class="customer">'+
'🆕 Cliente nuevo. Empezará con 1 punto.'+
'</div>';

}

}catch(e){}

};


$('sell').onclick=async()=>{

let name=$('name').value.trim();

let w=$('phone').value.replace(/\D/g,'');

let total=cart.reduce(
(s,x)=>s+x.precio*x.cantidad,
0
);

if(!name||w.length<10){

return $('result').innerHTML=
'<div class="success">'+
'⚠️ Escribe nombre y WhatsApp válido.'+
'</div>';

}

if(!cart.length){

return $('result').innerHTML=
'<div class="success">'+
'⚠️ Agrega productos.'+
'</div>';

}

$('sell').disabled=true;

try{

let f=await api(
'clientes',
'GET',
null,
'&whatsapp=eq.'+encodeURIComponent(w)+'&limit=1'
);

let c=f[0];

let pts=(c?c.puntos:0)+1;

let won=pts%config.points===0;

if(!c){

let a=await api(
'clientes',
'POST',
{
nombre:name,
whatsapp:w,
puntos:1,
premios_obtenidos:won?1:0
}
);

c=a[0];

}else{

let a=await api(
'clientes',
'PATCH',
{
nombre:name,
puntos:pts,
premios_obtenidos:
Number(c.premios_obtenidos||0)+(won?1:0)
},
'&id=eq.'+c.id
);

c=a[0]||{
...c,
puntos:pts
};

}


let v=(await api(
'ventas',
'POST',
{
cliente_id:c.id,
total:total,
puntos_ganados:1
}
))[0];


for(let x of cart){

await api(
'detalle_ventas',
'POST',
{
venta_id:v.id,
producto_id:x.producto_id,
nombre_producto:x.nombre,
cantidad:x.cantidad,
precio:x.precio
}
);

}


let shown=won?
config.points:
c.puntos%config.points;

let msg=won?

`🌽 ¡Hola ${name}! 🎉 Completaste ${config.points} puntos y ganaste ${config.prize}. 🎁`

:

`🌽 ¡Hola ${name}! ⭐ Sumaste 1 punto. Ahora tienes ${shown}/${config.points}. Te faltan ${config.points-shown} para tu premio.`;


$('result').innerHTML=

'<div class="success">'+
'<b>'+
(won?'🎉 ¡PREMIO DESBLOQUEADO!':'✅ Venta registrada')+
'</b><br>'+
name+' tiene '+shown+'/'+config.points+
' puntos.<br>'+
'<a target="_blank" href="https://wa.me/52'+
w+
'?text='+
encodeURIComponent(msg)+
'">💬 WhatsApp</a>'+
'</div>';

cart=[];

renderCart();

await load();

}catch(e){

$('result').innerHTML=
'<div class="success">⚠️ '+e.message+'</div>';

}finally{

$('sell').disabled=false;

}

};


$('posTab').onclick=()=>{

$('pos').classList.remove('hidden');
$('admin').classList.add('hidden');

$('posTab').classList.add('active');
$('adminTab').classList.remove('active');

};


$('adminTab').onclick=()=>{

$('pos').classList.add('hidden');
$('admin').classList.remove('hidden');

$('posTab').classList.remove('active');
$('adminTab').classList.add('active');

};


$('login').onclick=()=>{

if($('pin').value==='1234'){

$('loginBox').classList.add('hidden');
$('adminBox').classList.remove('hidden');

renderAdmin();

}else{

alert('PIN incorrecto');

}

};


$('logout').onclick=()=>{

$('adminBox').classList.add('hidden');
$('loginBox').classList.remove('hidden');

};


async function renderAdmin(){

let a=await api(
'configuracion',
'GET',
null,
'&order=id.asc&limit=1'
);

if(a[0]){

$('rewardPoints').value=
a[0].puntos_para_premio;

$('rewardName').value=
a[0].premio;

}


$('productsAdmin').innerHTML=

products.map(p=>

'<div class="adminrow">'+

'<input id="n'+p.id+'" value="'+p.nombre+'">'+

'<input id="p'+p.id+'" type="number" value="'+p.precio+'">'+

'<button data-save="'+p.id+'">Guardar</button>'+

'</div>'

).join('');

}


$('productsAdmin').onclick=async e=>{

let b=e.target.closest('[data-save]');

if(!b)return;

let id=b.dataset.save;

try{

await api(
'productos',
'PATCH',
{
nombre:$('n'+id).value,
precio:Number($('p'+id).value)
},
'&id=eq.'+id
);

await load();

renderAdmin();

alert('✅ Producto actualizado');

}catch(e){

alert('❌ No se pudo actualizar: '+e.message);

}

};


$('saveConfig').onclick=async()=>{

try{

let a=await api(
'configuracion',
'GET',
null,
'&order=id.asc&limit=1'
);

if(a[0]){

await api(
'configuracion',
'PATCH',
{
puntos_para_premio:
Number($('rewardPoints').value),

premio:
$('rewardName').value
},
'&id=eq.'+a[0].id
);

}

await load();

alert('Guardado');

}catch(e){

alert('❌ No se pudo guardar: '+e.message);

}

};


$('addProduct').onclick=async()=>{

let n=$('newName').value.trim();

let c=$('newCat').value.trim()||'Otros';

let p=Number($('newPrice').value);


if(!n||!p){

alert('⚠️ Escribe nombre y precio');

return;

}


$('addProduct').disabled=true;


try{

let respuesta=await api(
'productos',
'POST',
{
nombre:n,
categoria:c,
precio:p,
activo:true
}
);

console.log(
'Producto agregado:',
respuesta
);

alert(
'✅ Producto agregado correctamente'
);

$('newName').value='';
$('newCat').value='';
$('newPrice').value='';

await load();

renderAdmin();


}catch(e){

alert(
'❌ Error al agregar producto: '+
e.message
);

console.error(e);

}finally{

$('addProduct').disabled=false;

}

};


load();

</script>
</body>
</html>
