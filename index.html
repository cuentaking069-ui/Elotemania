<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Elotemanía</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#fff8df;color:#222}
main{max-width:1100px;margin:auto;padding:14px}
.top,.row{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.brand{font-size:30px;font-weight:900}
.sub,.muted{color:#666;font-size:13px}
.stats{display:flex;gap:7px}
.stat{background:#fff;border:1px solid #ddd;border-radius:12px;padding:8px;text-align:center}
.nav{display:flex;gap:8px;margin:14px 0}
.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:15px}
.card{background:#fff;border:1px solid #ddd;border-radius:17px;padding:15px;margin-bottom:15px}
.products{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.product,button,input{font:inherit}
.product,button{border:1px solid #ddd;border-radius:11px;padding:11px;background:#fff;cursor:pointer}
.primary,.active{background:#111!important;color:#fff!important}
input{width:100%;padding:11px;border:1px solid #ccc;border-radius:10px;margin-top:5px}
label{display:block;margin-top:9px}
.cartrow{display:flex;gap:8px;padding:7px 0;border-bottom:1px solid #eee}
.grow{flex:1}
.customer,.success{padding:10px;border:1px solid #ddd;border-radius:12px;margin-top:10px}
.success{background:#effff4}
.hidden{display:none}
.adminrow{display:grid;grid-template-columns:1fr 100px 85px;gap:7px;margin:7px 0}

@media(max-width:800px){
.layout{grid-template-columns:1fr}
}
</style>
</head>

<body>
<main>

<div class="top">
  <div>
    <div class="brand">🌽 ELOTEMANÍA</div>
