<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:Arial,Helvetica,sans-serif;
 background:#080808;
 color:#fff;
}

header{
 background:linear-gradient(135deg,#111,#1d1600);

}

header h1{

}

header p{

}

.container{

 padding:15px;
}

.stats{

 grid-template-columns:repeat(3,1fr);
 gap:10px;
 margin-bottom:15px;
}

.stat{

}

.tabs{

}

button{

 cursor:pointer;
}

.tab{

 color:#fff;
}

.tab.active{

 color:#000;
}

.panel{
 display:none;
}

.panel.active{
 display:block;
}

.card{
 background:#151515;
 border:1px solid #333;
 border-radius:14px;
 padding:15px;
 margin-bottom:15px;
}

.card h2{
 color:#ffd84d;
 margin-top:0;
}

input{
 width:100%;
 padding:13px;
 margin:6px 0;
 border-radius:9px;
 border:1px solid #444;
 background:#090909;
 color:#fff;
 font-size:16px;
}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(150px,1fr));
 gap:10px;
}

.product{
 background:#202020;
 border:1px solid #444;
 border-radius:12px;
 padding:14px;
 cursor:pointer;
}

.product:hover{
 border-color:#ffd84d;
}

.product strong{
 display:block;
 color:#ffd84d;
 margin-bottom:7px;
}

.product small{
 color:#bbb;
}

.cart-item{
 display:flex;
 justify-content:space-between;
 gap:10px;
 align-items:center;
 border-bottom:1px solid #333;
 padding:10px 0;
}

.cart-item button{
 padding:6px 9px;
 background:#8b0000;
 color:white;
}

.total{
 font-size:25px;
 color:#ffd84d;
 text-align:right;
 margin:15px 0;
}

.primary{
 width:100%;
 background:#ffd84d;
 color:#000;
 font-size:17px;
}

.green{
 background:#19a463;
 color:white;
}

.red{
 background:#9b1515;
 color:white;
}

.gray{
 background:#333;
 color:#fff;
}

.message{
 padding:12px;
 border-radius:10px;
 background:#102718;
 border:1px solid #24753e;
 margin-top:10px;
}

.points{
 font-size:28px;
 color:#ffd84d;
 font-weight:bold;
 margin:8px 0;
}

.premio{
 background:#3a2900;
 border:1px solid #ffd84d;
 color:#ffd84d;
 padding:12px;
 border-radius:10px;
 margin-top:10px;
 font-weight:bold;
}

.history{
 border-bottom:1px solid #333;
 padding:12px 0;
}

.user{
 background:#202020;
 padding:15px;
 border-radius:12px;
 margin-bottom:10px;
 border:1px solid #444;
}

.user b{
 color:#ffd84d;
}

.hidden{
 display:none!important;
}

@media(max-width:600px){
 .stats{
  grid-template-columns:1fr;
 }
 header h1{
  font-size:25px;
 }
}
</style>
</head>

<body>

<header>
 <h1>🌽 ELOTEMANÍA</h1>
 <p>Entre compas sabe mejor</p>
</header>

<div class="container">

 <div class="stats">

  </div>

 <div class="tabs">

   <!-- SOLO CHRISTIAN -->

   <div
    class="card"

   >

    >

    </button>

    </button>

</div>


<script>

let productos=[];
let carrito=[];
let ventas=[];

let configuracion={
 puntos_para_premio:10
};

let currentUser=null;

let clienteSeleccionado=null;
let clienteCanje=null;


/* =========================
   API
========================= */

const api="/api/supabase.js";


async function apiRequest(
 table,
 method="GET",
 params={},
 body=null
){

 let url=
  api+
  "?table="+
  encodeURIComponent(table);

 Object.keys(params).forEach(key=>{

  if(
   params[key]!==undefined &&
   params[key]!==null &&
   params[key]!==""
  ){

   url+="&"+
    encodeURIComponent(key)+
    "="+
    encodeURIComponent(params[key]);

  }

 });


 const options={
  method,
  headers:{
   "Content-Type":"application/json"
  }
 };


 if(body!==null){
  options.body=JSON.stringify(body);
 }


 const response=
  await fetch(url,options);


 const data=
  await response.json();


 if(!response.ok){

  throw new Error(
   data.error||
   data.message||
   "Error en Supabase"
  );

 }


 return data;
}


function dinero(numero){
 return Number(numero||0).toFixed(2);
}


function escapar(texto){

 return String(texto||"")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;");

}


function numeroWhatsapp(numero){

 let n=
  String(numero||"")
  .replace(/\D/g,"");

 if(n.length===10){
  n="52"+n;
 }

 return n;
}


/* =========================
   PANELES
========================= */

function mostrarPanel(id,boton){

 document
  .querySelectorAll(".panel")
  .forEach(p=>{
   p.classList.remove("active");
  });

 document
  .getElementById(id)
  .classList.add("active");

 document
  .querySelectorAll(".tab")
  .forEach(b=>{
   b.classList.remove("active");
  });

 boton.classList.add("active");
}


/* =========================
   PRODUCTOS
========================= */

async function cargarProductos(){

 try{

  productos=
   await apiRequest(
    "productos",
    "GET",
    {
     select:"*",
     activo:"eq.true",
     order:"id.asc"
    }
   );

  pintarProductos();

 }catch(error){

  document
   .getElementById("productos")
   .innerHTML=
   `<p>Error: ${escapar(error.message)}</p>`;

 }

}


function pintarProductos(){

 const contenedor=
  document.getElementById("productos");


 if(!productos.length){

  contenedor.innerHTML=
   "<p>No hay productos activos.</p>";

  return;

 }


 contenedor.innerHTML=
  productos.map(p=>`

   <div
    class="product"
    onclick="agregarProducto(${p.id})"
   >

    <strong>
     ${escapar(p.nombre)}
    </strong>

    <small>
     ${escapar(p.categoria||"")}
    </small>

    <br>

    <b>
     $${dinero(p.precio)}
    </b>

   </div>

  `).join("");

}


function agregarProducto(id){

 const producto=
  productos.find(
   p=>Number(p.id)===Number(id)
  );

 if(!producto)return;


 const existente=
  carrito.find(
   p=>Number(p.id)===Number(id)
  );


 if(existente){

  existente.cantidad++;

 }else{

  carrito.push({
   id:producto.id,
   nombre:producto.nombre,
   precio:Number(producto.precio),
   cantidad:1
  });

 }


 pintarCarrito();

}


function quitarProducto(id){

 const index=
  carrito.findIndex(
   p=>Number(p.id)===Number(id)
  );


 if(index===-1)return;


 carrito[index].cantidad--;


 if(carrito[index].cantidad<=0){

  carrito.splice(index,1);

 }


 pintarCarrito();

}


function pintarCarrito(){

 const contenedor=
  document.getElementById("carrito");


 if(!carrito.length){

  contenedor.innerHTML=
   "No hay productos.";

  document
   .getElementById("total")
   .textContent="0.00";

  return;

 }


 let total=0;


 contenedor.innerHTML=
  carrito.map(p=>{

   const subtotal=
    p.precio*p.cantidad;

   total+=subtotal;


   return `

    <div class="cart-item">

     <div>

      <b>
       ${escapar(p.nombre)}
      </b>

      <br>

      ${p.cantidad}
      ×
      $${dinero(p.precio)}

     </div>

     <button
      onclick="quitarProducto(${p.id})"
     >
      −
     </button>

    </div>

   `;

  }).join("");


 document
  .getElementById("total")
  .textContent=
  dinero(total);

}


/* =========================
   CLIENTES
========================= */

async function buscarCliente(){

 const nombre=
  document
   .getElementById("clienteNombre")
   .value.trim();


 const whatsapp=
  document
   .getElementById("clienteWhatsapp")
   .value
   .trim()
   .replace(/\D/g,"");


 if(!nombre&&!whatsapp){

  alert(
   "Escribe el nombre o WhatsApp."
  );

  return;

 }


 try{

  let resultado=[];


  if(whatsapp){

   resultado=
    await apiRequest(
     "clientes",
     "GET",
     {
      select:"*",
      whatsapp:"eq."+whatsapp,
      limit:"1"
     }
    );

  }


  if(!resultado.length&&nombre){

   resultado=
    await apiRequest(
     "clientes",
     "GET",
     {
      select:"*",
      nombre:"eq."+nombre,
      limit:"1"
     }
    );

  }


  if(resultado.length){

   clienteSeleccionado=
    resultado[0];

   document
    .getElementById("clienteNombre")
    .value=
    clienteSeleccionado.nombre;


   document
    .getElementById("clienteWhatsapp")
    .value=
    clienteSeleccionado.whatsapp||"";


   mostrarCliente(
    clienteSeleccionado,
    "clienteInfo"
   );

  }else{

   clienteSeleccionado=null;

   document
    .getElementById("clienteInfo")
    .innerHTML=
    `
     <div class="message">
      Cliente nuevo.
      <br><br>
      Al registrar la primera compra
      comenzará su contador.
     </div>
    `;

  }


 }catch(error){

  alert(error.message);

 }

}


/* =========================
   MOSTRAR CONTADOR
========================= */

function mostrarCliente(
 cliente,
 contenedor
){

 const puntos=
  Number(cliente.puntos||0);


 const necesarios=
  Number(
   configuracion.puntos_para_premio||10
  );


 let texto="";


 if(puntos<=0){

  texto=
   `
    <div class="premio">
     🎁 ¡CLIENTE LISTO PARA PREMIO!
     <br>
     Solicita el canje al vendedor o gerente.
    </div>
   `;

 }else{

  texto=
   `
    <div>
     Te faltan
     <b>${puntos}</b>
     compras para tu premio.
    </div>
   `;

 }


 document
  .getElementById(contenedor)
  .innerHTML=
  `
   <div class="message">

    <b>
     ${escapar(cliente.nombre)}
    </b>

    <div class="points">
     ⭐ ${puntos}
    </div>

    ${texto}

    <br>

    🎁 Premio

   </div>
  `;

}


/* =========================
   CONFIGURACIÓN
========================= */

async function cargarConfiguracion(){

 try{

  const datos=
   await apiRequest(
    "configuracion",
    "GET",
    {
     select:"*",
     limit:"1"
    }
   );


  if(datos.length){

   configuracion=
    datos[0];

  }


  document
   .getElementById("puntosPremio")
   .value=
   configuracion.puntos_para_premio||10;


 }catch(error){

  console.log(error);

 }

}


async function guardarConfiguracion(){

 if(currentUser!=="christian"){

  alert(
   "Solo el gerente puede cambiar la configuración."
  );

  return;

 }


 const puntos=
  Number(
   document
    .getElementById("puntosPremio")
    .value
  );


 if(puntos<1){

  alert(
   "Escribe una cantidad válida."
  );

  return;

 }


 try{

  const actual=
   await apiRequest(
    "configuracion",
    "GET",
    {
     select:"id",
     limit:"1"
    }
   );


  if(actual.length){

   await apiRequest(
    "configuracion",
    "PATCH",
    {
     id:"eq."+actual[0].id
    },
    {
     puntos_para_premio:puntos,
     premio:"Premio"
    }
   );

  }else{

   await apiRequest(
    "configuracion",
    "POST",
    {},
    {
     puntos_para_premio:puntos,
     premio:"Premio"
    }
   );

  }


  configuracion.puntos_para_premio=
   puntos;

  configuracion.premio=
   "Premio";


  alert(
   "Configuración guardada."
  );


 }catch(error){

  alert(error.message);

 }

}


/* =========================
   REGISTRAR VENTA
========================= */

async function registrarVenta(){

 if(!carrito.length){

  alert(
   "Agrega productos al carrito."
  );

  return;

 }


 const nombre=
  document
   .getElementById("clienteNombre")
   .value.trim();


 let whatsapp=
  document
   .getElementById("clienteWhatsapp")
   .value
   .trim()
   .replace(/\D/g,"");


 if(!nombre){

  alert(
   "Escribe el nombre del cliente."
  );

  return;

 }


 try{

  let cliente=
   clienteSeleccionado;


  /*
   BUSCAR CLIENTE
  */

  if(!cliente&&whatsapp){

   const encontrados=
    await apiRequest(
     "clientes",
     "GET",
     {
      select:"*",
      whatsapp:"eq."+whatsapp,
      limit:"1"
     }
    );


   if(encontrados.length){

    cliente=
     encontrados[0];

   }

  }


  /*
   CREAR CLIENTE NUEVO
  */

  if(!cliente){

   const puntosIniciales=
    Number(
     configuracion.puntos_para_premio||10
    );


   const nuevos=
    await apiRequest(
     "clientes",
     "POST",
     {},
     {
      nombre,
      whatsapp,
      puntos:puntosIniciales,
      premios_obtenidos:0
     }
    );


   cliente=
    nuevos[0];

  }


  /*
   CONTADOR REGRESIVO

   Cada compra resta 1.

   Nunca baja de 0.

   NO SE REINICIA AQUÍ.

   El reinicio ocurre solamente
   cuando el vendedor o gerente
   canjea el premio.
  */

  const puntosAntes=
   Number(cliente.puntos);


  const puntosDespues=
   Math.max(
    0,
    puntosAntes-1
   );


  const total=
   carrito.reduce(
    (suma,p)=>
     suma+
     p.precio*p.cantidad,
    0
   );


  /*
   CREAR VENTA
  */

  const nuevasVentas=
   await apiRequest(
    "ventas",
    "POST",
    {},
    {
     cliente_id:cliente.id,
     total,
     puntos_ganados:1,
     corte_id:null
    }
   );


  const venta=
   nuevasVentas[0];


  /*
   DETALLE
  */

  for(const producto of carrito){

   await apiRequest(
    "detalle_ventas",
    "POST",
    {},
    {
     venta_id:venta.id,
     producto_id:producto.id,
     nombre_producto:producto.nombre,
     cantidad:producto.cantidad,
     precio:producto.precio
    }
   );

  }


  /*
   ACTUALIZAR CONTADOR
  */

  await apiRequest(
   "clientes",
   "PATCH",
   {
    id:"eq."+cliente.id
   },
   {
    puntos:puntosDespues
   }
  );


  cliente.puntos=
   puntosDespues;


  clienteSeleccionado=
   cliente;


  /*
   WHATSAPP
  */

  let mensaje=
`🌽 *ELOTEMANÍA* 🌽

Hola ${nombre}!
Gracias por tu compra.

💰 Total: $${dinero(total)}

⭐ Compras restantes para tu Premio: ${puntosDespues}

🎁 Premio`;


  if(puntosDespues===0){

   mensaje+=
`
🎉 ¡Ya puedes solicitar tu Premio!`;

  }


  let botonWhatsApp="";


  if(whatsapp){

   const numero=
    numeroWhatsapp(whatsapp);


   const url=
    "https://wa.me/"+
    numero+
    "?text="+
    encodeURIComponent(mensaje);


   botonWhatsApp=
    `
     <br>

     <a
      href="${url}"
      target="_blank"
      style="
       display:block;
       text-align:center;
       background:#25D366;
       color:white;
       padding:14px;
       border-radius:10px;
       text-decoration:none;
       font-weight:bold;
      "
     >
      📲 Abrir WhatsApp y enviar mensaje
     </a>
    `;

  }


  document
   .getElementById("resultadoVenta")
   .innerHTML=
   `
    <div class="message">

     <b>
      ✅ Venta registrada
     </b>

     <br><br>

     Cliente:
     ${escapar(nombre)}

     <br>

     Total:
     $${dinero(total)}

     <br><br>

     ⭐ Compras restantes:
     <span class="points">
      ${puntosDespues}
     </span>

     ${
      puntosDespues===0
      ?
      `
       <div class="premio">
        🎁 ¡LISTO PARA CANJEAR PREMIO!
       </div>
      `
      :
      `
       <br>
       🎁 Premio
      `
     }

     ${botonWhatsApp}

    </div>
   `;


  carrito=[];

  pintarCarrito();


  document
   .getElementById("clienteNombre")
   .value="";


  document
   .getElementById("clienteWhatsapp")
   .value="";


  clienteSeleccionado=null;


  await cargarEstadisticas();


 }catch(error){

  alert(
   "No se pudo registrar la venta:\n"+
   error.message
  );

 }

}


/* =========================
   CANJE
========================= */

async function buscarClienteCanje(){

 const whatsapp=
  document
   .getElementById("canjeWhatsapp")
   .value
   .trim()
   .replace(/\D/g,"");

/*
 SOLO VENDEDORES Y GERENTE
 PUEDEN CANJEAR.
*/

async function canjearPremio(){

 if(
  currentUser!=="christian" &&
  currentUser!=="andrid"
 ){

  alert(
   "Debes iniciar sesión como vendedor o gerente."
  );

  return;

 }


 if(!clienteCanje){

  alert(
   "Busca primero al cliente."
  );

  return;

 }


 const puntos=
  Number(
   clienteCanje.puntos||0
  );


 /*
  SOLO PUEDE CANJEAR CUANDO
  LLEGÓ A CERO.
 */

 if(puntos>0){

  alert(
   "Este cliente todavía necesita "+
   puntos+
   " compra(s) para obtener su Premio."
  );

  return;

 }


 const reinicio=
  Number(
   configuracion.puntos_para_premio||10
  );


 try{

  /*
   AL CANJEAR:

   0 → 10

   El premio se registra.
  */

  const premios=
   Number(
    clienteCanje.premios_obtenidos||0
   )+1;


  await apiRequest(
   "clientes",
   "PATCH",
   {
    id:"eq."+clienteCanje.id
   },
   {
    puntos:reinicio,
    premios_obtenidos:premios
   }
  );


  clienteCanje.puntos=
   reinicio;


  clienteCanje.premios_obtenidos=
   premios;


  document
   .getElementById("canjeInfo")
   .innerHTML=
   `
    <div class="message">

     🎉 <b>¡Premio canjeado!</b>

     <br><br>

     Cliente:
     ${escapar(clienteCanje.nombre)}

     <br><br>

     🎁 Premio

     <br><br>

     ⭐ Nuevo contador:
     <span class="points">
      ${reinicio}
     </span>

     <br>

     Ya puede comenzar a acumular
     nuevamente.

    </div>
   `;


 }catch(error){

  alert(error.message);

 }

}

/* =========================
   HISTORIAL
========================= */

async function cargarHistorial(){

 try{

  const datos=
   await apiRequest(
    "ventas",
    "GET",
    {
     select:"*",
     order:"id.desc",
     limit:"100"
    }
   );


  ventas=
   datos||[];


  const contenedor=
   document.getElementById("historial");


  if(!ventas.length){

   contenedor.innerHTML=
    "<p>No hay ventas.</p>";

   return;

  }


  contenedor.innerHTML=
   ventas.map(v=>`

    <div class="history">

     <b>
      Venta #${v.id}
     </b>

     <br>

     Cliente ID:
     ${v.cliente_id||"-"}

     <br>

     Total:
     $${dinero(v.total)}

     <br>

     ⭐ Compra:
     ${v.puntos_ganados||1}

    </div>

   `).join("");


 }catch(error){

  document
   .getElementById("historial")
   .innerHTML=
   `<p>${escapar(error.message)}</p>`;

 }

}


/* =========================
   CORTE
========================= */

async function hacerCorte(){

 if(
  currentUser!=="christian" &&
  currentUser!=="andrid"
 ){

  alert(
   "Inicia sesión."
  );

  return;

 }


 try{

  const ventasActuales=
   await apiRequest(
    "ventas",
    "GET",
    {
     select:"*",
     corte_id:"is.null"
    }
   );


  const clientesActuales=
   await apiRequest(
    "clientes",
    "GET",
    {
     select:"id"
    }
   );


  const total=
   ventasActuales.reduce(
    (s,v)=>
     s+Number(v.total||0),
    0
   );


  const corte=
   await apiRequest(
    "cierres_turno",
    "POST",
    {},
    {
     ventas:ventasActuales.length,
     clientes:clientesActuales.length,
     efectivo_esperado:total,
     efectivo_contado:total,
     diferencia:0
    }
   );


  const corteId=
   corte[0].id;


  for(
   const venta of ventasActuales
  ){

   await apiRequest(
    "ventas",
    "PATCH",
    {
     id:"eq."+venta.id
    },
    {
     corte_id:corteId
    }
   );

  }


  document
   .getElementById("corteResultado")
   .innerHTML=
   `
    <div class="message">

     ✅ Corte realizado.

     <br>

     Ventas:
     ${ventasActuales.length}

     <br>

     Total:
     $${dinero(total)}

     <br>

     Corte #${corteId}

    </div>
   `;


 }catch(error){

  alert(error.message);

 }

}

   ELIMINAR CORTE
========================= */

async function eliminarUltimoCorte(){

 if(currentUser!=="christian"){

  alert(
   "Solo Christian puede eliminar cortes."
  );

  return;

 }


 if(!confirm(
  "¿Seguro que quieres eliminar el último corte y sus ventas?"
 )){

  return;

 }


 try{

  const cortes=
   await apiRequest(
    "cierres_turno",
    "GET",
    {
     select:"*",
     order:"id.desc",
     limit:"1"
    }
   );


  if(!cortes.length){

   alert(
    "No hay cortes."
   );

   return;

  }


  const corte=
   cortes[0];


  const ventasCorte=
   await apiRequest(
    "ventas",
    "GET",
    {
     select:"*",
     corte_id:"eq."+corte.id
    }
   );


  for(
   const venta of ventasCorte
  ){

   await apiRequest(
    "detalle_ventas",
    "DELETE",
    {
     venta_id:"eq."+venta.id
    }
   );


   await apiRequest(
    "ventas",
    "DELETE",
    {
     id:"eq."+venta.id
    }
   );

  }


  await apiRequest(
   "cierres_turno",
   "DELETE",
   {
    id:"eq."+corte.id
   }
  );


  alert(
   "Corte eliminado correctamente."
  );


  cargarHistorial();
  cargarEstadisticas();


 }catch(error){

  alert(error.message);

 }

}
