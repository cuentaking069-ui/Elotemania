<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Elotemanía POS</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#d4af37">

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial;background:#111;color:#fff}
header{background:#000;padding:18px;text-align:center;border-bottom:2px solid #d4af37}
header h1{margin:0;color:#d4af37;font-size:28px}
header p{margin:5px 0;color:#ddd}
.container{max-width:1100px;margin:auto;padding:15px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:15px}
.stat{background:#1d1d1d;border:1px solid #333;border-radius:12px;padding:15px;text-align:center}
.stat b{display:block;font-size:24px;color:#d4af37}
.tabs{display:flex;gap:8px;margin-bottom:15px}
button{border:0;border-radius:10px;padding:13px;font-weight:bold;cursor:pointer}
.tabs button{flex:1}
.btn-gold{background:#d4af37;color:#000}
.btn-dark{background:#292929;color:#fff}
.btn-green{background:#25d366;color:#fff}
.btn-red{background:#c62828;color:#fff}
.btn-blue{background:#1976d2;color:#fff}
.btn-purple{background:#7b1fa2;color:#fff}
.card{background:#1b1b1b;border:1px solid #333;border-radius:14px;padding:15px;margin-bottom:15px}
h2{color:#d4af37;margin-top:0}
input,select{width:100%;padding:13px;border-radius:9px;border:1px solid #444;background:#101010;color:#fff;margin:6px 0 10px;font-size:16px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.producto{background:#242424;border:1px solid #444;border-radius:12px;padding:12px}
.producto strong{display:block;margin-bottom:6px}
.producto button{width:100%;margin-top:8px}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #333;padding:10px 0}
.total{font-size:24px;color:#d4af37;text-align:right;margin-top:15px}
.hidden{display:none}
.alerta{padding:12px;border-radius:10px;background:#332b00;border:1px solid #d4af37;margin-top:10px}
.premio{padding:14px;border-radius:10px;background:#153d1d;border:1px solid #25d366;margin-top:10px}
.resultado{padding:15px;background:#202020;border-radius:12px;margin-top:12px}
.corte{background:#242424;border:1px solid #444;border-radius:12px;padding:15px;margin-top:10px}
.venta-corte{background:#191919;border:1px solid #333;border-radius:10px;padding:12px;margin-top:10px}
.separador{border:0;border-top:1px solid #333;margin:18px 0}
.ganancia{color:#25d366;font-weight:bold}
.perdida{color:#ff5252;font-weight:bold}
@media(max-width:700px){
.stats{grid-template-columns:1fr 1fr}
.tabs{flex-direction:column}
}
</style>
</head>

<body>

<header>
<h1>🌽 ELOTEMANÍA</h1>
<p>Entre compas sabe mejor</p>
</header>

<div class="container">

<div class="stats">
<div class="stat"><span>Ventas</span><b id="ventasHoy">0</b></div>
<div class="stat"><span>Clientes</span><b id="clientesHoy">0</b></div>
<div class="stat"><span>Utilidad</span><b id="utilidadHoy">$0</b></div>
<div class="stat"><span>Turno</span><b>1</b></div>
</div>

<div class="tabs">
<button class="btn-gold" onclick="mostrarVenta()">🛒 Venta</button>
<button class="btn-dark" onclick="mostrarAcceso()">🔐 Acceso</button>
</div>

<section id="ventaSection">

<div class="card">
<h2>🛒 Productos</h2>
<div id="productos" class="grid">Cargando productos...</div>
</div>

<div class="card">
<h2>🧾 Venta</h2>
<div id="carrito">No hay productos.</div>
<div class="total">Total: $<span id="total">0.00</span></div>
</div>

<div class="card">
<h2>👤 Cliente</h2>

<input id="nombreCliente" placeholder="Nombre del cliente">
<input id="whatsappCliente" type="tel" placeholder="10 dígitos">

<button class="btn-blue" style="width:100%" onclick="buscarCliente()">
🔎 Buscar cliente
</button>

<div id="clienteResultado"></div>

<button class="btn-gold" style="width:100%;margin-top:10px" onclick="registrarVenta()">
💰 Registrar venta
</button>
</div>

</section>

<section id="accesoSection" class="hidden">

<div class="card">
<h2>🔐 Acceso</h2>

<input id="usuario" placeholder="Usuario">
<input id="pin" type="password" placeholder="PIN">

<button class="btn-gold" style="width:100%" onclick="login()">
Entrar
</button>

<div id="accesoResultado"></div>
</div>

<div id="adminSection" class="hidden">

<div class="card">
<h2>👑 Administrador de Christian</h2>
<div id="usuarioActual"></div>
</div>

<div id="productosAdmin" class="card hidden">
<h2>💰 Productos y ganancias</h2>

<input id="nuevoProductoNombre" placeholder="Nombre del producto">
<input id="nuevoProductoCategoria" placeholder="Categoría">

<label>Costo para Elotemanía</label>
<input id="nuevoProductoCosto" type="number" step="0.01" min="0" placeholder="Ej. 25">

<label>Precio de venta</label>
<input id="nuevoProductoPrecio" type="number" step="0.01" min="0" placeholder="Ej. 60">

<button class="btn-gold" style="width:100%" onclick="agregarProductoNuevo()">
➕ Guardar producto
</button>

<div id="productoResultado"></div>
<hr class="separador">
<div id="listaProductosAdmin"></div>
</div>

<div id="usuariosAdmin" class="card hidden">

<h2>👥 Usuarios</h2>

<input id="nuevoUsuario" placeholder="Nuevo usuario">
<input id="nuevoUsuarioNombre" placeholder="Nombre">
<input id="nuevoUsuarioPin" type="password" placeholder="PIN">

<select id="nuevoUsuarioRol">
<option value="empleado">Empleado</option>
<option value="admin">Administrador</option>
</select>

<button class="btn-gold" style="width:100%" onclick="crearUsuario()">
➕ Crear usuario
</button>

<div id="usuarioResultado"></div>

<hr class="separador">
<div id="listaUsuarios"></div>
</div>

<div class="card">
<h2>🎁 Cliente / Premio</h2>

<input id="buscarAdmin" placeholder="WhatsApp del cliente">

<button class="btn-blue" style="width:100%" onclick="buscarClienteAdmin()">
🔎 Buscar cliente
</button>

<div id="adminClienteResultado"></div>
</div>

<div class="card">
<h2>📊 Cortes</h2>

<button class="btn-purple" style="width:100%" onclick="verCortes()">
📊 Ver cortes
</button>

<div id="listaCortes"></div>
</div>

<div class="card">
<h2>⚙️ Turno</h2>

<button class="btn-gold" style="width:100%" onclick="hacerCorte()">
💰 Cerrar turno
</button>

<button class="btn-red" style="width:100%;margin-top:10px" onclick="borrarUltimoCorte()">
🗑️ Borrar último corte
</button>

<button class="btn-red" style="width:100%;margin-top:10px" onclick="borrarHistorial()">
🗑️ Borrar todo el historial
</button>
</div>

</div>
</section>
</div>

<script>

const API="/api/supabase";

let productos=[];
let carrito=[];
let clientes=[];
let currentUser=null;
let currentRole=null;
let clienteSeleccionado=null;

let configuracion={
 puntos_para_premio:10,
 premio:"Premio"
};

async function api(tabla,metodo="GET",cuerpo=null,params={}){

 const url=new URL(API,window.location.origin);

 url.searchParams.set("table",tabla);

 Object.keys(params).forEach(k=>{
  if(params[k]!==undefined&&params[k]!==null){
   url.searchParams.set(k,params[k]);
  }
 });

 const opciones={
  method:metodo,
  headers:{"Content-Type":"application/json"}
 };

 if(cuerpo!==null){
  opciones.body=JSON.stringify(cuerpo);
 }

 const respuesta=await fetch(url.toString(),opciones);
 const texto=await respuesta.text();

 let datos;

 try{
  datos=texto?JSON.parse(texto):null;
 }catch{
  throw new Error(texto||"Respuesta inválida");
 }

 if(!respuesta.ok){
  throw new Error(
   datos?.message||
   datos?.error||
   datos?.details||
   "Error en Supabase"
  );
 }

 return datos;
}

async function iniciar(){

 try{
  await cargarConfiguracion();
  await cargarProductos();
  await cargarClientes();
  await actualizarEstadisticas();
 }catch(error){
  console.error(error);
  alert("Error al iniciar:\n"+error.message);
 }
}

iniciar();

function mostrarVenta(){
 document.getElementById("ventaSection").classList.remove("hidden");
 document.getElementById("accesoSection").classList.add("hidden");
}

function mostrarAcceso(){
 document.getElementById("ventaSection").classList.add("hidden");
 document.getElementById("accesoSection").classList.remove("hidden");
}

async function cargarConfiguracion(){

 try{

  const datos=await api("configuracion","GET",null,{
   select:"*",
   limit:1
  });

  if(datos?.length){
   configuracion.puntos_para_premio=
    Number(datos[0].puntos_para_premio)||10;
  }

 }catch(error){
  console.log(error);
 }
}

async function cargarProductos(){

 productos=await api("productos","GET",null,{
  select:"*",
  activo:"eq.true",
  order:"nombre.asc"
 });

 renderProductos();
}

function renderProductos(){

 const contenedor=document.getElementById("productos");

 if(!productos.length){
  contenedor.innerHTML="No hay productos activos.";
  return;
 }

 contenedor.innerHTML="";

 productos.forEach(producto=>{

  const div=document.createElement("div");
  div.className="producto";

  div.innerHTML=`
   <strong>${escapeHtml(producto.nombre)}</strong>
   <div>$${dinero(producto.precio)}</div>

   <button class="btn-gold"
    onclick="agregarProducto(${producto.id})">
    Agregar
   </button>
  `;

  contenedor.appendChild(div);
 });
}

function agregarProducto(id){

 const producto=productos.find(
  p=>Number(p.id)===Number(id)
 );

 if(!producto)return;

 const existente=carrito.find(
  p=>Number(p.id)===Number(id)
 );

 if(existente){
  existente.cantidad++;
 }else{
  carrito.push({
   id:producto.id,
   nombre:producto.nombre,
   precio:Number(producto.precio),
   costo:Number(producto.costo||0),
   cantidad:1
  });
 }

 renderCarrito();
}

function quitarProducto(id){

 const index=carrito.findIndex(
  p=>Number(p.id)===Number(id)
 );

 if(index===-1)return;

 if(carrito[index].cantidad>1){
  carrito[index].cantidad--;
 }else{
  carrito.splice(index,1);
 }

 renderCarrito();
}

function renderCarrito(){

 const contenedor=document.getElementById("carrito");

 if(!carrito.length){

  contenedor.innerHTML="No hay productos.";
  document.getElementById("total").textContent="0.00";
  return;
 }

 contenedor.innerHTML="";

 let total=0;

 carrito.forEach(item=>{

  const subtotal=item.precio*item.cantidad;
  total+=subtotal;

  const div=document.createElement("div");
  div.className="item";

  div.innerHTML=`
   <div>
    <strong>${escapeHtml(item.nombre)}</strong>
    <br>
    ${item.cantidad} × $${dinero(item.precio)}
   </div>

   <button class="btn-red"
    onclick="quitarProducto(${item.id})">
    −
   </button>
  `;

  contenedor.appendChild(div);
 });

 document.getElementById("total").textContent=dinero(total);
}

function obtenerTotal(){

 return carrito.reduce(
  (total,item)=>total+item.precio*item.cantidad,
  0
 );
}

function obtenerUtilidad(){

 return carrito.reduce(
  (total,item)=>
   total+(item.precio-item.costo)*item.cantidad,
  0
 );
}

async function cargarClientes(){

 clientes=await api("clientes","GET",null,{
  select:"*",
  order:"nombre.asc"
 });
}

function normalizarWhatsapp(numero){
 return String(numero||"").replace(/\D/g,"");
}

function numeroWhatsapp(numero){

 let n=normalizarWhatsapp(numero);

 if(n.length===10)n="52"+n;

 return n;
}

async function buscarCliente(){

 const whatsapp=normalizarWhatsapp(
  document.getElementById("whatsappCliente").value
 );

 if(!whatsapp){
  alert("Escribe el número de WhatsApp.");
  return;
 }

 try{

  const encontrados=await api("clientes","GET",null,{
   select:"*",
   whatsapp:"eq."+whatsapp,
   limit:1
  });

  if(encontrados.length){

   clienteSeleccionado=encontrados[0];

   document.getElementById("nombreCliente").value=
    clienteSeleccionado.nombre||"";

   mostrarClienteResultado(clienteSeleccionado);

  }else{

   clienteSeleccionado=null;

   document.getElementById("clienteResultado").innerHTML=`
    <div class="alerta">
     👤 Cliente nuevo.<br><br>
     Empezará con
     <strong>${configuracion.puntos_para_premio}</strong>
     compras restantes.
    </div>
   `;
  }

 }catch(error){
  alert("No se pudo buscar:\n"+error.message);
 }
}

function mostrarClienteResultado(cliente){

 const puntos=Number(cliente.puntos);

 let html=`
  <div class="resultado">
   <strong>👤 ${escapeHtml(cliente.nombre)}</strong>
   <br><br>
   📱 ${escapeHtml(cliente.whatsapp)}
   <br><br>
   ⭐ Compras restantes:
   <strong>${puntos}</strong>
 `;

 if(puntos<=0){

  html+=`
   <div class="premio">
    🎉 ¡Ya puede solicitar su Premio!
   </div>
  `;

 }else{

  html+=`
   <div class="alerta">
    ⭐ Le faltan <strong>${puntos}</strong>
    compras para su Premio.
   </div>
  `;
 }

 html+="</div>";

 document.getElementById("clienteResultado").innerHTML=html;
}

async function registrarVenta(){

 if(!carrito.length){
  alert("Agrega al menos un producto.");
  return;
 }

 const nombre=document.getElementById("nombreCliente").value.trim();

 const whatsapp=normalizarWhatsapp(
  document.getElementById("whatsappCliente").value
 );

 if(!nombre){
  alert("Escribe el nombre del cliente.");
  return;
 }

 if(!whatsapp){
  alert("Escribe el WhatsApp del cliente.");
  return;
 }

 try{

  let clienteActual=null;

  const encontrados=await api("clientes","GET",null,{
   select:"*",
   whatsapp:"eq."+whatsapp,
   limit:1
  });

  if(encontrados.length){
   clienteActual=encontrados[0];
  }

  let puntosAntes;
  let puntosDespues;

  if(clienteActual){

   puntosAntes=Number(clienteActual.puntos);

   if(!Number.isFinite(puntosAntes)||puntosAntes<0){
    puntosAntes=configuracion.puntos_para_premio;
   }

   puntosDespues=Math.max(0,puntosAntes-1);

  }else{

   puntosAntes=configuracion.puntos_para_premio;
   puntosDespues=Math.max(0,puntosAntes-1);
  }

  if(clienteActual){

   const actualizado=await api("clientes","PATCH",{
    nombre:nombre,
    whatsapp:whatsapp,
    puntos:puntosDespues
   },{
    id:"eq."+clienteActual.id
   });

   clienteActual=actualizado[0];

  }else{

   const nuevo=await api("clientes","POST",{
    nombre:nombre,
    whatsapp:whatsapp,
    puntos:puntosDespues,
    premios_obtenidos:0
   });

   clienteActual=nuevo[0];
  }

  const total=obtenerTotal();
  const utilidad=obtenerUtilidad();

  const venta=await api("ventas","POST",{
   cliente_id:clienteActual.id,
   total:total,
   utilidad:utilidad,
   puntos_ganados:1,
   corte_id:null
  });

  const ventaId=venta[0].id;

  for(const item of carrito){

   await api("detalle_ventas","POST",{
    venta_id:ventaId,
    producto_id:item.id,
    nombre_producto:item.nombre,
    cantidad:item.cantidad,
    precio:item.precio,
    costo:item.costo
   });
  }

  let botonWhatsApp="";

  if(whatsapp){

   const numero=numeroWhatsapp(whatsapp);

   const mensaje=
`🌽 ELOTEMANÍA 🌽

Hola ${nombre}!
Gracias por tu compra.

💰 Total: $${dinero(total)}

⭐ Compras restantes para tu Premio: ${puntosDespues}

🎁 Premio`;

   const url=
    "https://wa.me/"+numero+
    "?text="+encodeURIComponent(mensaje);

   botonWhatsApp=`
    <br>
    <a href="${url}" target="_blank"
     style="display:block;text-align:center;background:#25D366;color:white;padding:14px;border-radius:10px;text-decoration:none;font-weight:bold">
     📲 Abrir WhatsApp
    </a>
   `;
  }

  document.getElementById("clienteResultado").innerHTML=`
   <div class="resultado">

    <h3>✅ Venta registrada</h3>

    👤 ${escapeHtml(nombre)}

    <br><br>

    💰 Total:
    <strong>$${dinero(total)}</strong>

    <br><br>

    ⭐ Compras restantes:
    <strong>${puntosDespues}</strong>

    ${
     puntosDespues===0
     ?
     `<div class="premio">🎉 ¡Ya puede solicitar su Premio!</div>`
     :""
    }

    ${botonWhatsApp}

   </div>
  `;

  carrito=[];
  renderCarrito();

  await cargarClientes();
  await actualizarEstadisticas();

 }catch(error){

  console.error(error);

  alert(
   "No se pudo registrar la venta:\n"+
   error.message
  );
 }
}

/* =========================
   LOGIN CORREGIDO
========================= */

async function login(){

 const usuario=document.getElementById("usuario")
  .value.trim().toLowerCase();

 const pin=document.getElementById("pin")
  .value.trim();

 if(!usuario||!pin){

  document.getElementById("accesoResultado").innerHTML=`
   <div class="alerta">
    ⚠️ Escribe usuario y PIN.
   </div>
  `;

  return;
 }

 try{

  /*
   * IMPORTANTE:
   * Traemos los usuarios y comparamos aquí.
   * Así no importa si Supabase guardó
   * Christian con mayúscula o minúscula.
   */

  const usuarios=await api("usuarios","GET",null,{
   select:"*",
   activo:"eq.true"
  });

  const user=usuarios.find(u=>
   String(u.usuario||"").trim().toLowerCase()===usuario &&
   String(u.pin||"").trim()===pin &&
   u.activo===true
  );

  if(!user){

   document.getElementById("accesoResultado").innerHTML=`
    <div class="alerta">
     ❌ Usuario o PIN incorrecto.
    </div>
   `;

   return;
  }

  currentUser=user.usuario;
  currentRole=String(user.rol||"empleado").toLowerCase();

  document.getElementById("adminSection")
   .classList.remove("hidden");

  const esChristian=
   currentRole==="superadmin"||
   String(user.usuario).toLowerCase()==="christian";

  const esAdmin=
   esChristian||
   currentRole==="admin";

  document.getElementById("usuarioActual").innerHTML=`
   <div class="premio">

    ${
     esChristian
     ?"👑"
     :esAdmin
     ?"🛡️"
     :"👤"
    }

    Bienvenido
    <strong>
     ${escapeHtml(user.nombre||user.usuario)}
    </strong>

    <br><br>

    Rol:
    <strong>
     ${
      esChristian
      ?"Administrador de Christian"
      :currentRole==="admin"
      ?"Administrador"
      :"Empleado"
     }
    </strong>

   </div>
  `;

  document.getElementById("accesoResultado").innerHTML="";

  aplicarPermisos();

 }catch(error){

  console.error(error);

  document.getElementById("accesoResultado").innerHTML=`
   <div class="alerta">
    ❌ No se pudo iniciar sesión.<br><br>
    ${escapeHtml(error.message)}
   </div>
  `;
 }
}

function aplicarPermisos(){

 const esChristian=
  currentRole==="superadmin"||
  String(currentUser).toLowerCase()==="christian";

 const esAdmin=
  esChristian||
  currentRole==="admin";

 document.getElementById("productosAdmin")
  .classList.toggle("hidden",!esAdmin);

 /*
  * SOLO CHRISTIAN puede administrar usuarios.
  */

 document.getElementById("usuariosAdmin")
  .classList.toggle("hidden",!esChristian);

 /*
  * Si es administrador puede ver costos,
  * utilidades y cortes.
  */

 if(esAdmin){

  cargarProductosAdmin();

 }

 if(esChristian){

  cargarUsuarios();

 }
}

/* =========================
   PRODUCTOS
========================= */

async function cargarProductosAdmin(){

 const esAdmin=
  currentRole==="superadmin"||
  currentRole==="admin"||
  String(currentUser).toLowerCase()==="christian";

 if(!esAdmin)return;

 try{

  const lista=await api("productos","GET",null,{
   select:"*",
   activo:"eq.true",
   order:"nombre.asc"
  });

  const contenedor=
   document.getElementById("listaProductosAdmin");

  contenedor.innerHTML="";

  lista.forEach(p=>{

   const costo=Number(p.costo||0);
   const precio=Number(p.precio||0);
   const utilidad=precio-costo;
   const margen=precio>0?(utilidad/precio)*100:0;

   const div=document.createElement("div");
   div.className="resultado";

   div.innerHTML=`
    <strong>${escapeHtml(p.nombre)}</strong>

    <br><br>

    Costo:
    <strong>$${dinero(costo)}</strong>

    <br><br>

    Venta:
    <strong>$${dinero(precio)}</strong>

    <br><br>

    Utilidad:
    <span class="ganancia">
     $${dinero(utilidad)}
    </span>

    <br><br>

    Margen:
    <strong>${dinero(margen)}%</strong>

    <br><br>

    <button class="btn-blue"
     style="width:100%"
     onclick="editarCostoPrecio(${p.id})">
     ✏️ Cambiar costo y precio
    </button>
   `;

   contenedor.appendChild(div);
  });

 }catch(error){
  console.error(error);
 }
}

async function editarCostoPrecio(id){

 const esAdmin=
  currentRole==="superadmin"||
  currentRole==="admin"||
  String(currentUser).toLowerCase()==="christian";

 if(!esAdmin){
  alert("Sin permiso.");
  return;
 }

 let producto=productos.find(
  p=>Number(p.id)===Number(id)
 );

 if(!producto){

  const lista=await api("productos","GET",null,{
   select:"*",

async function hacerCorte(){

 if(!currentUser){
  alert("Debes iniciar sesión.");
  return;
 }

 try{

  const ventas=await api("ventas","GET",null,{
   select:"*"
  });

  const pendientes=ventas.filter(
   v=>v.corte_id===null||v.corte_id===undefined
  );

  const total=pendientes.reduce(
   (s,v)=>s+Number(v.total||0),0
  );

  const utilidad=pendientes.reduce(
   (s,v)=>s+Number(v.utilidad||0),0
  );

  if(!pendientes.length){
   alert("No hay ventas pendientes.");
   return;
  }

  const contado=prompt(
   "Efectivo contado:\n\nEsperado: $"+
   dinero(total)
  );

  if(contado===null)return;

  const efectivoContado=Number(contado);

  if(
   !Number.isFinite(efectivoContado)||
   efectivoContado<0
  ){
   alert("Cantidad inválida.");
   return;
  }

  const diferencia=efectivoContado-total;

  const clientesCorte=new Set(
   pendientes.map(v=>v.cliente_id).filter(Boolean)
  );

  const corte=await api("cierres_turno","POST",{
   ventas:pendientes.length,
   clientes:clientesCorte.size,
   efectivo_esperado:total,
   efectivo_contado:efectivoContado,
   diferencia:diferencia
  });

  const corteId=corte[0].id;

  for(const venta of pendientes){

   await api("ventas","PATCH",{
    corte_id:corteId
   },{
    id:"eq."+venta.id
   });
  }

  alert(
   "✅ Turno cerrado.\n\n"+
   "Ventas: "+pendientes.length+
   "\nEsperado: $"+dinero(total)+
   "\nContado: $"+dinero(efectivoContado)+
   "\nDiferencia: $"+dinero(diferencia)+
   "\n\nUtilidad: $"+dinero(utilidad)
  );

  await actualizarEstadisticas();
  await verCortes();

 }catch(error){
  alert("No se pudo cerrar:\n"+error.message);
 }
}

async function actualizarEstadisticas(){

 try{

  const ventas=await api("ventas","GET",null,{
   select:"*"
  });

  document.getElementById("ventasHoy").textContent=
   ventas.length;

  const clientesUnicos=new Set(
   ventas.map(v=>v.cliente_id).filter(Boolean)
  );

  document.getElementById("clientesHoy").textContent=
   clientesUnicos.size;

  const utilidad=ventas.reduce(
   (s,v)=>s+Number(v.utilidad||0),0
  );

  document.getElementById("utilidadHoy").textContent=
   "$"+dinero(utilidad);

 }catch(error){
  console.log(error);
 }
}

function dinero(valor){
 return Number(valor||0).toFixed(2);
}

function formatearFecha(fecha){

 if(!fecha)return "Sin fecha";

 const d=new Date(fecha);

 if(Number.isNaN(d.getTime())){
  return String(fecha);
 }

 return d.toLocaleString("es-MX",{
  dateStyle:"medium",
  timeStyle:"short"
 });
}

function escapeHtml(text){

 return String(text??"")
  .replace(/&/g,"&amp;")
  .replace(/</g,"&lt;")
  .replace(/>/g,"&gt;")
  .replace(/"/g,"&quot;")
  .replace(/'/g,"&#039;");
}

if("serviceWorker" in navigator){

 window.addEventListener("load",function(){

  navigator.serviceWorker
   .register("/sw.js")
   .catch(error=>console.error(error));

 });
}
